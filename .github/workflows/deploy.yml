name: Deploy to GitHub Pages

# Builds the static site and publishes dist/ to the gh-pages branch, which GitHub Pages serves
# at motion.kamirtyai.com (public/CNAME is copied into dist/).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: motion.kamirtyai.com
          commit_message: Deploy ${{ github.sha }}
